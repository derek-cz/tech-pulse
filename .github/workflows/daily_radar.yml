name: Daily Tech Pulse

on:
  schedule:
    # 每天 UTC 00:30（对应北京时间 08:30，工作日/周末均定时唤醒）
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库页面随时手动点击 Run 测试

# 赋予 Contents 与 Pages 部署所需权限
permissions:
  contents: write
  pages: write
  id-token: write

# 限制并发，保证部署互不干扰
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tech Pulse Pipeline
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          PAGES_URL: https://derek-cz.github.io/tech-pulse/
        run: |
          python main.py

      - name: Commit and Push Daily Digest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ index.html || true
          git commit -m "chore: archive daily digest [skip ci]" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
